services:
  broker:
    build:
      context: .
      dockerfile: apps/broker/Dockerfile
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [dynamodb-local, minio, clickhouse, control-plane]

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    env_file: .env
    ports: ["8090:8090"]
    depends_on: [dynamodb-local, minio, clickhouse]

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports: ["8000:8000"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports: ["8123:8123", "9002:9000"]
