name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Phase 5.2 — hourly continuous-monitor run. The cron only fires
    # against the default branch, which is exactly what we want for
    # production-deployment monitoring.
    - cron: "17 * * * *"

# Run a single in-flight job per ref; superseded runs get cancelled so
# a PR with rapid pushes doesn't queue up stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/sovereign-platform

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check libs apps tests packs

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy libs/common/sovereign

  policy-test:
    name: policy test (opa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install opa
        run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: opa test (verify + 100% coverage on base + pack bundles)
        run: |
          opa test policies/ packs/finops/sovereign_finops/policies/ packs/ai/sovereign_ai/policies/ packs/data/sovereign_data/policies/ packs/secops/sovereign_secops/policies/ packs/identity/sovereign_identity/policies/ packs/multicloud/sovereign_multicloud/policies/ packs/comms/sovereign_comms/policies/ packs/edge/sovereign_edge/policies/ -v
          coverage=$(opa test policies/ packs/finops/sovereign_finops/policies/ packs/ai/sovereign_ai/policies/ packs/data/sovereign_data/policies/ --coverage --format=json | python3 -c "import json,sys; d=json.load(sys.stdin); print(int(d['coverage']))")
          echo "Overall policy coverage: $coverage%"
          # Gate: fail if overall policy coverage drops below 100%.
          [ "$coverage" -ge 100 ] || { echo "::error::policy coverage $coverage% < 100%"; exit 1; }

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest with coverage
        run: pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  portal:
    name: portal (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: vitest (includes jest-axe a11y assertions)
        run: npm test
      - name: production build
        run: npm run build
      - name: upload built bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-dist
          path: apps/portal/dist
          retention-days: 7

  docker-build:
    # Build the chassis service images on every PR so a broken Dockerfile
    # never lands on main. Push to GHCR only on main.
    name: docker build (${{ matrix.service }})
    needs: [lint, typecheck, test, policy-test, portal]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [broker, control-plane, audit-service, metering-service, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: compute lowercase image prefix
        # GHCR rejects uppercase characters in repository names; the GH owner
        # ('Bobcatsfan33') has one. Lowercasing in shell keeps the workflow
        # portable to other owners without hardcoding.
        id: img
        run: |
          prefix="$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          load: true  # load into the local docker so trivy can scan it
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.prefix }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.img.outputs.prefix }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Phase 5.2 / SI-2 — trivy gate. Fail the build on any critical
      # or high CVE so vulnerable images never reach :latest. A SARIF
      # report uploads as a CI artefact for the continuous monitor.
      - name: trivy scan (fail on critical/high)
        uses: aquasecurity/trivy-action@v0.36.0
        # setup-trivy resolves the trivy binary version via the GitHub
        # releases API. Anonymously that shares a 60 req/hr budget which
        # 5 concurrent matrix jobs exhaust — one job (seen: portal) then
        # dies with "Trivy version vX not found ... 403 Rate limit
        # exceeded". GITHUB_TOKEN lifts the limit to 5000 req/hr so the
        # security gate is deterministic. TRIVY_DB_REPOSITORY pins the
        # vuln-DB to GHCR (no Docker Hub pull limits).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.img.outputs.prefix }}-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # Absolute path — the trivy-action entrypoint resolves
          # 'trivyignores' relative to its own working dir, not the
          # repo root. Using ${{ github.workspace }} pins the lookup
          # to the repo checkout.
          trivyignores: ${{ github.workspace }}/.trivyignore
      - name: write scan timestamp (for continuous-monitor freshness check)
        if: always()
        run: |
          mkdir -p .trivy-reports
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .trivy-reports/${{ matrix.service }}.timestamp
      - name: upload trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: |
            trivy-${{ matrix.service }}.sarif
            .trivy-reports/${{ matrix.service }}.timestamp
          retention-days: 14

  continuous-monitor:
    # Phase 5.2 — cron-driven continuous monitoring. Runs every hour on
    # the head of main (the CI cron syntax only fires against default
    # branch). Locally-runnable via `python scripts/continuous_monitor.py`.
    name: continuous monitor
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: install opa
        run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - name: run monitor
        env:
          AUDIT_SERVICE_URL: ${{ secrets.AUDIT_SERVICE_URL }}
          SOVEREIGN_BEARER_TOKEN: ${{ secrets.SOVEREIGN_BEARER_TOKEN }}
          AWS_REGION: us-gov-west-1
        run: python scripts/continuous_monitor.py --format json
