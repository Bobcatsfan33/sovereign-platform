apiVersion: apps/v1
kind: Deployment
metadata: { name: sovereign-control-plane }
spec:
  replicas: 2
  selector: { matchLabels: { app: sovereign-control-plane } }
  template:
    metadata: { labels: { app: sovereign-control-plane } }
    spec:
      containers:
      - name: control-plane
        image: sovereign/control-plane:latest
        ports: [{ containerPort: 8090 }]
        readinessProbe: { httpGet: { path: /healthz, port: 8090 } }
