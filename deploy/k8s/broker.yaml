apiVersion: apps/v1
kind: Deployment
metadata: { name: sovereign-broker }
spec:
  replicas: 2
  selector: { matchLabels: { app: sovereign-broker } }
  template:
    metadata: { labels: { app: sovereign-broker } }
    spec:
      containers:
      - name: broker
        image: sovereign/broker:latest
        ports: [{ containerPort: 8080 }]
        readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata: { name: sovereign-broker }
spec:
  selector: { app: sovereign-broker }
  ports: [{ port: 8080, targetPort: 8080 }]
