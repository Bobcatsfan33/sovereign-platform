# Horizontal Pod Autoscaling for the chassis backend services (WS2).
#
# The Deployments set resource requests (required for utilization-based HPA)
# and PodDisruptionBudgets; this adds the missing horizontal autoscaling so
# the services scale with load instead of running a fixed replica count. CPU
# is the primary signal, memory a secondary guard; scale-down is dampened so a
# brief dip doesn't thrash capacity.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: broker
  namespace: sovereign-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: broker
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
---
