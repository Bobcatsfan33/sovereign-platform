apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: sovereign-platform
spec:
  replicas: 3
  selector:
    matchLabels: { app: broker }
  template:
    metadata:
      labels: { app: broker }
    spec:
      serviceAccountName: broker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: broker
          image: ghcr.io/bobcatsfan33/sovereign-platform-broker:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: sovereign-config }
            - secretRef: { name: sovereign-runtime }
          env:
            - { name: SERVICE_NAME, value: broker }
            - { name: WORKLOAD_IDENTITY, value: "spiffe://sovereign-platform/broker" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
        - name: envoy-sidecar
          image: envoyproxy/envoy:v1.31.5
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "broker"]
          ports:
            - { name: mesh-in, containerPort: 15006 }
            - { name: mesh-out, containerPort: 15001 }
          readinessProbe: { tcpSocket: { port: mesh-in }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: mesh-in }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1337
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: sidecar-bootstrap, mountPath: /etc/envoy, readOnly: true }
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true }
            - { name: envoy-tmp, mountPath: /tmp }
      initContainers:
        - name: mesh-iptables
          image: registry.k8s.io/build-image/debian-iptables:bookworm-v1.0.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Inbound -> sidecar :15006, app egress -> sidecar :15001. Exclude
              # the sidecar's own uid (1337), loopback, and the control plane
              # (DNS 53, kube API 443, SPIRE 8081) so the SVID bootstrap path is
              # never captured. Tighten 443 to the API server CIDR per cluster.
              iptables -t nat -N SOV_OUT
              iptables -t nat -A OUTPUT -p tcp -j SOV_OUT
              iptables -t nat -A SOV_OUT -m owner --uid-owner 1337 -j RETURN
              iptables -t nat -A SOV_OUT -o lo -j RETURN
              iptables -t nat -A SOV_OUT -p tcp --dport 53 -j RETURN
              iptables -t nat -A SOV_OUT -p tcp --dport 443 -j RETURN
              iptables -t nat -A SOV_OUT -p tcp --dport 8081 -j RETURN
              iptables -t nat -A SOV_OUT -p tcp -j REDIRECT --to-ports 15001
              iptables -t nat -N SOV_IN
              iptables -t nat -A PREROUTING -p tcp -j SOV_IN
              iptables -t nat -A SOV_IN -p tcp --dport 15006 -j RETURN
              iptables -t nat -A SOV_IN -p tcp --dport 15001 -j RETURN
              iptables -t nat -A SOV_IN -p tcp -j REDIRECT --to-ports 15006
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { add: [NET_ADMIN, NET_RAW], drop: [ALL] }
            readOnlyRootFilesystem: true
      volumes:
        - name: sidecar-bootstrap
          configMap: { name: sidecar-bootstrap-broker }
        - name: spire-agent-socket
          hostPath: { path: /run/spire/sockets, type: DirectoryOrCreate }
        - name: envoy-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
