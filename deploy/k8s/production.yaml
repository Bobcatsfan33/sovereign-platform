kind: Deployment
metadata:
  name: audit-service
  namespace: sovereign-platform
spec:
  replicas: 3
  selector:
    matchLabels: { app: audit-service }
  template:
    metadata:
      labels: { app: audit-service }
    spec:
      serviceAccountName: audit-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: audit-service
          image: ghcr.io/bobcatsfan33/sovereign-platform-audit-service:0.1.0
          ports: [{ name: http, containerPort: 8086 }]
          envFrom:
            - configMapRef: { name: sovereign-config }
            - secretRef: { name: sovereign-runtime }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: sovereign-platform
spec:
  selector: { app: audit-service }
  ports: [{ name: http, port: 8086, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering-service
  namespace: sovereign-platform
spec:
  replicas: 3
  selector:
    matchLabels: { app: metering-service }
  template:
    metadata:
      labels: { app: metering-service }
    spec:
      serviceAccountName: metering-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: metering-service
          image: ghcr.io/bobcatsfan33/sovereign-platform-metering-service:0.1.0
          ports: [{ name: http, containerPort: 8087 }]
          envFrom:
            - configMapRef: { name: sovereign-config }
            - secretRef: { name: sovereign-runtime }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: metering-service
  namespace: sovereign-platform
spec:
  selector: { app: metering-service }
  ports: [{ name: http, port: 8087, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: sovereign-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: portal }
  template:
    metadata:
      labels: { app: portal }
    spec:
      serviceAccountName: portal
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portal
          image: ghcr.io/bobcatsfan33/sovereign-platform-portal:0.1.0
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: sovereign-platform
spec:
  selector: { app: portal }
  ports: [{ name: http, port: 8088, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: sovereign-platform
spec:
  replicas: 3
  selector:
    matchLabels: { app: opa }
  template:
    metadata:
      labels: { app: opa }
    spec:
      serviceAccountName: opa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: opa
          image: openpolicyagent/opa:1.6.0-rootless
          args: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
          ports: [{ name: http, containerPort: 8181 }]
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
      volumes:
        - name: policies
          configMap:
            name: opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: sovereign-platform
spec:
  selector: { app: opa }
  ports: [{ name: http, port: 8181, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: broker
  namespace: sovereign-platform
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: broker }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-plane
  namespace: sovereign-platform
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: control-plane }
