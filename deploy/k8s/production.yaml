apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-platform
  labels:
    # The mesh-iptables init container needs NET_ADMIN/NET_RAW, which the
    # `restricted` PSS forbids, so enforce is relaxed to `privileged` for this
    # namespace (the trade-off you accepted for transparent iptables egress).
    # audit/warn stay at `restricted` so every workload is still flagged if it
    # drifts from the hardened baseline, and the app + envoy containers keep
    # drop:[ALL]/no-priv-escalation/read-only-rootfs regardless.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-config
  namespace: sovereign-platform
data:
  ENV: production
  AWS_REGION: us-gov-west-1
  CONFIG_BUCKET: sovereign-configs-prod
  OPA_URL: http://opa:8181
  OPA_DECISION_PATH: v1/data/sovereign/decision
  CONTROL_PLANE_URL: http://control-plane:8090
  AUDIT_SERVICE_URL: http://audit-service:8086
  METERING_SERVICE_URL: http://metering-service:8087
  AUDIT_RETENTION_DAYS: "730"
  SHARED_BEARER_AUTH_ENABLED: "false"
  WORKLOAD_IDENTITY_ENABLED: "true"
  REQUIRE_OIDC: "true"
  REQUIRE_MANAGED_SECRETS: "true"
  SECRETS_PROVIDER: aws-secrets-manager
  # Permissive rollout: the inbound listener accepts plaintext too, so the app
  # must still authorize non-mTLS callers (no XFCC yet) — hence MTLS_REQUIRED
  # off for now. STRICT CUTOVER: regenerate mesh-sidecars.yaml with
  # MESH_MTLS_STRICT=true (drops the plaintext chain) AND set MTLS_REQUIRED=true
  # here, once every caller is confirmed mTLS.
  MTLS_REQUIRED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: sovereign-runtime
  namespace: sovereign-platform
type: Opaque
stringData:
  OIDC_ISSUER_URL: replace-me
  OIDC_AUDIENCE: replace-me
  ALLOWED_WORKLOAD_IDENTITIES: spiffe://sovereign-platform/broker,spiffe://sovereign-platform/control-plane,spiffe://sovereign-platform/audit-service,spiffe://sovereign-platform/metering-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sovereign-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chassis-internal
  namespace: sovereign-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker
  namespace: sovereign-platform
  annotations:
    eks.amazonaws.com/role-arn: replace-with-broker-irsa-role
---
