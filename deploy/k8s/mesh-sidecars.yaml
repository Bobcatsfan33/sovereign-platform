# Per-pod Envoy mesh sidecar bootstraps — GENERATED, do not hand-edit.
#
# Each ConfigMap is the exact output of
# sovereign.render.render_sidecar_bootstrap(<service>, <app_port>) with
# MESH_SDS_ENABLED=true and WORKLOAD_IDENTITY=spiffe://sovereign-platform/<service>.
# tests/test_mesh_sidecar_wiring.py re-renders and asserts these match, so
# regenerate (not hand-edit) when the renderer changes.
#
# ROLLOUT (transparent / iptables-redirect, Istio-style):
#   0. Deploy SPIRE first (spire.yaml). A sidecar that cannot get an SVID goes
#      NotReady and drops its pod from Service endpoints, so the agent must be
#      healthy before injection.
#   1. INJECT (per backend Deployment in production.yaml): an init container
#      programs iptables to redirect inbound -> :15006 and the app's outbound
#      -> :15001, excluding the sidecar's own uid and loopback; plus the
#      `envoy-sidecar` container running `envoy -c /etc/envoy/envoy.yaml`,
#      mounting this ConfigMap at /etc/envoy and the SPIRE socket dir
#      (hostPath /run/spire/sockets) read-only.
#   2. The init container needs NET_ADMIN/NET_RAW, which the `restricted` Pod
#      Security Standard forbids — the namespace enforce level is relaxed for
#      the mesh pods as part of injection. The app + envoy containers stay
#      hardened (drop:[ALL], no privilege escalation, read-only rootfs).
#   3. No app changes and no Service retarget: iptables makes inbound mTLS
#      termination and outbound mTLS origination transparent to the workload.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sidecar-bootstrap-broker
  namespace: sovereign-platform
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: inbound_mtls
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 15006
        listener_filters:
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
        filter_chains:
        - filter_chain_match:
            transport_protocol: tls
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificate_sds_secret_configs:
                - name: spiffe://sovereign-platform/broker
                  sds_config:
                    api_config_source:
                      api_type: GRPC
                      transport_api_version: V3
                      grpc_services:
                      - envoy_grpc:
                          cluster_name: spiffe_sds
                validation_context_sds_secret_config:
                  name: spiffe://sovereign-platform
                  sds_config:
                    api_config_source:
                      api_type: GRPC
                      transport_api_version: V3
                      grpc_services:
                      - envoy_grpc:
                          cluster_name: spiffe_sds
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: broker_inbound
              route_config:
                name: inbound_routes
                virtual_hosts:
                - name: local_app
                  domains:
                  - '*'
                  routes:
                  - match:
                      prefix: /
                    route:
                      cluster: local_app
              forward_client_cert_details: SANITIZE_SET
              set_current_client_cert_details:
                uri: true
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - filter_chain_match:
            transport_protocol: raw_buffer
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: broker_inbound
              route_config:
                name: inbound_routes
                virtual_hosts:
                - name: local_app
                  domains:
                  - '*'
                  routes:
                  - match:
                      prefix: /
                    route:
                      cluster: local_app
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - name: outbound_mtls
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 15001
        listener_filters:
        - name: envoy.filters.listener.original_dst
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: outbound
              cluster: outbound_mtls
      clusters:
      - name: local_app
        connect_timeout: 2s
        type: STATIC
        load_assignment:
          cluster_name: local_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8080
      - name: outbound_mtls
        type: ORIGINAL_DST
        lb_policy: CLUSTER_PROVIDED
        connect_timeout: 2s
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            common_tls_context:
              tls_certificate_sds_secret_configs:
              - name: spiffe://sovereign-platform/broker
                sds_config:
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                    - envoy_grpc:
                        cluster_name: spiffe_sds
              validation_context_sds_secret_config:
                name: spiffe://sovereign-platform
                sds_config:
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                    - envoy_grpc:
                        cluster_name: spiffe_sds
      - name: spiffe_sds
        type: STATIC
        connect_timeout: 1s
        http2_protocol_options: {}
        load_assignment:
          cluster_name: spiffe_sds
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  pipe:
                    path: /run/spire/sockets/agent.sock
    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

