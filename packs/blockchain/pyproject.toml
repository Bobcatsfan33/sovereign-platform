[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-blockchain-pack"
version = "0.1.0"
description = "Sovereign Platform Blockchain pack — permissioned ledgers with membership/key-custody policy."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.entry-points."sovereign.packs"]
blockchain = "sovereign_blockchain:Pack"

[tool.setuptools.packages.find]
where = ["."]
include = ["sovereign_blockchain*"]
