[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-edge-pack"
version = "0.1.0"
description = "Sovereign Platform Edge pack — hardened edge nodes and clusters with FIPS/attestation policy."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.entry-points."sovereign.packs"]
edge = "sovereign_edge:Pack"

[tool.setuptools.packages.find]
where = ["."]
include = ["sovereign_edge*"]
