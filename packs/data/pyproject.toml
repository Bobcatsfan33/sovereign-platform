[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-data-pack"
version = "0.1.0"
description = "Sovereign Platform Data pack — managed databases and vector stores via Terraform, with data-protection policy."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.entry-points."sovereign.packs"]
data = "sovereign_data:Pack"

[tool.setuptools.packages.find]
where = ["."]
include = ["sovereign_data*"]
