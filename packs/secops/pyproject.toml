[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-secops-pack"
version = "0.1.0"
description = "Sovereign Platform SecOps pack — SIEM workspaces and log pipelines with AU-family policy."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.entry-points."sovereign.packs"]
secops = "sovereign_secops:Pack"

[tool.setuptools.packages.find]
where = ["."]
include = ["sovereign_secops*"]
