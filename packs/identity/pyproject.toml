[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-identity-pack"
version = "0.1.0"
description = "Sovereign Platform Identity pack — IdP broker and SCIM bridge with IA-family policy."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.entry-points."sovereign.packs"]
identity = "sovereign_identity:Pack"

[tool.setuptools.packages.find]
where = ["."]
include = ["sovereign_identity*"]
