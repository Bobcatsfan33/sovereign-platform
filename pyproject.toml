[project]
name = "sovereign-platform"
version = "0.1.0"
description = "Compliance-native self-service infrastructure platform for regulated and government environments. Base chassis plus modular service packs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "boto3>=1.34",
  "jinja2>=3.1",
  "httpx>=0.27",
  "clickhouse-connect>=0.7",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 100
