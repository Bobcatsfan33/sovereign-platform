[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-platform"
version = "0.1.0"
description = "Compliance-native self-service infrastructure platform for regulated and government environments. Base chassis plus modular service packs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "boto3>=1.34",
  "jinja2>=3.1",
  "httpx>=0.27",
  "clickhouse-connect>=0.7",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "moto>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "boto3-stubs[dynamodb,s3]",
]

[tool.setuptools.packages.find]
where = ["libs/common"]
include = ["sovereign*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "C4",            # comprehensions
  "SIM",           # simplify
]
ignore = [
  "E501",  # line length — ruff format handles this
  "B008",  # function calls in defaults — common FastAPI pattern (Depends, Query, Header)
]

[tool.pytest.ini_options]
testpaths = ["tests", "packs/finops/tests", "packs/ai/tests", "packs/data/tests", "packs/secops/tests", "packs/identity/tests", "packs/multicloud/tests", "packs/comms/tests", "packs/edge/tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "unit: fast in-process unit tests",
  "integration: tests that require live docker-compose services",
]

[tool.coverage.run]
branch = true
source = ["libs/common/sovereign", "apps"]
omit = ["**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
